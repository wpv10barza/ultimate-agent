name: assemble-drive-import
on:
  push:
    branches: [import/drive-2026-06-13]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify audited Drive snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .migration_payload_v3/part-00 .migration_payload_v3/part-01 .migration_payload_v3/part-02 .migration_payload_v3/part-03 .migration_payload_v3/part-04 .migration_payload_v3/part-05 > /tmp/ultimate-agent.tar.gz
          printf '%s  %s\n' 'd826d567f2340b539fec168c6c3cc3b1487485ea3afe1ae08e341a41a0b4949f' '/tmp/ultimate-agent.tar.gz' | sha256sum -c -
          tar -tzf /tmp/ultimate-agent.tar.gz >/dev/null
          tar -xzf /tmp/ultimate-agent.tar.gz -C .
          rm -rf .migration_payload .migration_payload_v2 .migration_payload_v3
          python -m compileall -q .
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python -m json.tool tools.json >/dev/null
          python -m json.tool diccionario_minero.json >/dev/null
          bash -n instalar_modulos_linux_pi.sh
          if grep -RIE --exclude-dir=.git --exclude-dir=.github --exclude='MIGRATION_MANIFEST.md' '(-----BEGIN .*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]+|AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}|api[_-]?key[[:space:]]*=[[:space:]]*[^<[:space:]]+|password[[:space:]]*=[[:space:]]*[^<[:space:]]+)' .; then
            echo 'Potential secret detected'; exit 1
          fi
          rm -f .github/workflows/ci.yml
          git restore --source=HEAD --worktree --staged .github/workflows/assemble-drive-import.yml
      - name: Commit verified canonical snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Assemble verified Ultimate Agent Drive snapshot [skip ci]'
          git push
