name: assemble-drive-import
on:
  push:
    branches: [import/drive-2026-06-13]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose assembled payload
        shell: bash
        run: |
          set -euo pipefail
          cat .migration_payload/part-00 .migration_payload/part-01 .migration_payload/part-02 .migration_payload/part-03 .migration_payload/part-04 > /tmp/ultimate-agent.tar.gz
          echo 'ASSEMBLED_SHA256:'
          sha256sum /tmp/ultimate-agent.tar.gz
          echo 'ARCHIVE_LIST:'
          tar -tzf /tmp/ultimate-agent.tar.gz
          echo 'ARCHIVE_TEST_OK'
